name: Testes funcionais e Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test-and-build-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Instalar Taurus
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Baixar Apache JMeter
        run: |
          curl -fsSL "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.zip" -o "apache-jmeter-5.6.3.zip"
          unzip -q "apache-jmeter-5.6.3.zip"

      - name: Subir API ServeRest
        run: |
          nohup npx --yes serverest@latest > serverest.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://localhost:3000 >/dev/null; then
              echo "ServeRest disponivel em http://localhost:3000"
              exit 0
            fi
            sleep 2
          done
          cat serverest.log
          exit 1

      - name: Executar testes funcionais
        id: tests
        run: |
          set +e
          bzt config/bzt-functional.yml
          TEST_EXIT=$?
          echo "exit_code=$TEST_EXIT" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Gerar relatorio funcional
        if: always()
        shell: pwsh
        run: |
          $source = "artifacts/functional/kpi.jtl"
          $result = "artifacts/functional/resultados-funcionais-serverest.jtl"

          if (-not (Test-Path -LiteralPath $source)) {
            New-Item -ItemType Directory -Path "relatorio" -Force | Out-Null
            "<!doctype html><html lang=""pt-BR""><head><meta charset=""utf-8""><title>Relatorio funcional indisponivel</title></head><body><h1>Relatorio funcional indisponivel</h1><p>Nao foi possivel localizar o arquivo de resultados do JMeter nesta execucao.</p></body></html>" | Set-Content -Path "relatorio/index.html" -Encoding UTF8
            throw "Arquivo de resultados nao encontrado: $source"
          }

          Copy-Item -LiteralPath $source -Destination $result -Force
          ./scripts/gerar-relatorio-funcional.ps1 `
            -InputJtl $result `
            -FallbackJtl $source `
            -OutputDir "relatorio"

      - name: Preparar relatorio para Pages
        if: always()
        run: |
          if [ ! -f "relatorio/index.html" ]; then
            mkdir -p relatorio
            cat > relatorio/index.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR">
            <head>
              <meta charset="utf-8">
              <title>Relatorio funcional indisponivel</title>
            </head>
            <body>
              <h1>Relatorio funcional indisponivel</h1>
              <p>Nao foi possivel gerar o relatorio nesta execucao.</p>
            </body>
          </html>
          HTML
          fi
          touch "relatorio/.nojekyll"

      - name: Configurar GitHub Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload do relatorio
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: relatorio

      - name: Verificar resultado dos testes
        if: always()
        run: |
          TEST_EXIT="${{ steps.tests.outputs.exit_code }}"
          if [ -z "$TEST_EXIT" ]; then
            echo "A etapa de testes nao foi concluida."
            exit 1
          fi
          exit "$TEST_EXIT"

  deploy:
    if: always()
    runs-on: ubuntu-latest
    needs: test-and-build-report
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
